<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class of 2027 Jackets</title>
    <style>
        :root {
            --primary: #ec4899;
            --secondary: #8b5cf6;
            --accent: #3b82f6;
            --success: #10b981;
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #1a0b2e 50%, #0f172a 100%);
            --card-bg: rgba(255, 255, 255, 0.07);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: #f8fafc;
            margin: 0;
            padding: 15px 10px;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 2px;
            background: linear-gradient(90deg, #ff758c, #ff7eb3, #a1c4fd, #c2e9fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
        }
        p.subtitle {
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            max-width: 900px;
            margin: 0 auto 25px auto;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 12px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .image-pair {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .image-pair div {
            flex: 1;
        }
        .image-pair img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.2s;
        }
        .image-pair img:hover {
            transform: scale(1.03);
        }
        .image-label {
            font-size: 0.75rem;
            color: #cbd5e1;
            margin-top: 4px;
            font-weight: 600;
        }
        .wheel-section {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid;
            border-image: linear-gradient(135deg, #ff758c, #8b5cf6, #3b82f6) 1;
            border-radius: 16px;
            max-width: 450px;
            margin: 0 auto;
            padding: 20px;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.3);
        }
        .wheel-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 15px auto;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #fff;
            position: relative;
            overflow: hidden;
            transition: transform 6s cubic-bezier(0.15, 0, 0.15, 1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            background: conic-gradient(
                #ff416c 0deg 120deg, 
                #7f00ff 120deg 240deg, 
                #00c6ff 240deg 360deg
            );
        }
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid #fbbf24;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .wheel-label {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            font-weight: bold;
            font-size: 0.85rem;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        /* Positions for labels on the 3-slice wheel */
        .w-slice-1 { transform: rotate(60deg); padding-top: 15px; }
        .w-slice-2 { transform: rotate(180deg); padding-top: 15px; }
        .w-slice-3 { transform: rotate(300deg); padding-top: 15px; }

        button {
            background: linear-gradient(135deg, #ff416c, #ff4b2b, #7f00ff);
            background-size: 200% auto;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            transition: 0.3s;
        }
        button:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
        }
        button:active {
            transform: scale(0.95);
        }
        #wheel-status {
            font-size: 0.9rem;
            color: #f3e8ff;
            margin-top: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <h1>✨ CLASS OF 2027 DROP ✨</h1>
    <p class="subtitle">⚡ Official High-Energy Custom Merch Collection ⚡</p>

    <!-- 2x2 Product Grid -->
    <div class="grid">
        <!-- Varsity Jacket -->
        <div class="card">
            <h3>Varsity Jacket</h3>
            <div class="image-pair">
                <div>
                    <img src="image.png" alt="Varsity Front">
                    <div class="image-label">Front</div>
                </div>
                <div>
                    <img src="image_3.png" alt="Varsity Back">
                    <div class="image-label">Back</div>
                </div>
            </div>
        </div>

        <!-- Hoodie -->
        <div class="card">
            <h3>Custom Hoodie</h3>
            <div class="image-pair">
                <div>
                    <img src="image_4.png" alt="Hoodie Front">
                    <div class="image-label">Front</div>
                </div>
                <div>
                    <img src="image_2.png" alt="Hoodie Back">
                    <div class="image-label">Back</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Dopamine Spin Wheel Section -->
    <div class="wheel-section">
        <h3>🎡 Mystery Wheel 🎡</h3>
        <p style="font-size: 0.8rem; color: #cbd5e1; margin: 2px 0 10px 0;">You can only spin once per user!</p>
        
        <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <div id="wheel" class="wheel">
                <!-- Visual mock segments inside wheel text -->
                <div style="position:relative; width:100%; height:100%;">
                    <div style="position:absolute; top:20px; left:50%; transform:translateX(-50%); font-size:0.75rem; color:#fff; font-weight:bold; text-shadow:0 1px 2px #000;">🎁 Perk</div>
                    <div style="position:absolute; bottom:25px; left:30px; font-size:0.75rem; color:#fff; font-weight:bold; text-shadow:0 1px 2px #000;">🔥 Drop</div>
                    <div style="position:absolute; bottom:25px; right:30px; font-size:1.1rem; color:#fff; text-shadow:0 1px 2px #000;">❌</div>
                </div>
            </div>
        </div>

        <p id="wheel-status">Spin the wheel to unlock your mystery reward!</p>
        <button id="spin-btn" onclick="spinWheel()">SPIN NOW 🔥</button>
    </div>

    <script>
        function spinWheel() {
            if (localStorage.getItem('mystery_wheel_used_2027')) {
                alert("You can only spin once per user!");
                return;
            }
            
            // Mark as used immediately so they can't spam click
            localStorage.setItem('mystery_wheel_used_2027', 'true');
            
            const wheel = document.getElementById('wheel');
            const btn = document.getElementById('spin-btn');
            const status = document.getElementById('wheel-status');
            
            btn.style.opacity = '0.5';
            btn.style.pointerEvents = 'none';
            status.innerText = "✨ Spinning with maximum energy... Good luck! ✨";
            
            // 6 seconds spin (Multiple full rotations + target slice offset)
            // 3 slices total (120 degrees each). Let's land on slice 1 (Special Perk) -> random extra rotations
            const randomRotation = 2160 + 60; // 6 full turns (360 * 6 = 2160) + landing angle
            wheel.style.transform = `rotate(${randomRotation}deg)`;
            
            setTimeout(() => {
                status.innerHTML = "🎉 <span style='color:#f43f5e; font-size:1.1rem;'>JACKPOT! Special Mystery Reward Unlocked!</span> 🎉";
                btn.innerText = "REWARD CLAIMED ✅";
            }, 6000);
        }

        window.onload = function() {
            if (localStorage.getItem('mystery_wheel_used_2027')) {
                document.getElementById('wheel-status.innerHTML') = "✨ Reward already claimed! You can only spin once per user. ✨";
                const btn = document.getElementById('spin-btn');
                btn.innerText = "ALREADY SPUN";
                btn.style.opacity = '0.5';
                btn.style.pointerEvents = 'none';
            }
        }
    </script>
</body>
</html>
